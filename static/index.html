      <a class="nav-item" href="#/library" data-route="/library"><i>▦</i>模型库</a>
      <div class="nav-group">生成</div>
      <a class="nav-item" href="#/depth" data-route="/depth"><i>◍</i>单图重建</a>

    <div class="view" id="view"></div>
